name: Перевірка джерел і публікація

on:
  schedule:
    - cron: "17 5 * * *"   # щодня о 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тести
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Перевірка офіційних джерел
        run: python monitor.py --report reports/latest.md

      - name: Зберегти стан і журнал змін
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Оновлено стан перевірки джерел" && git push)

      - name: Сповістити про зміни (GitHub Issue)
        if: hashFiles('reports/latest.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Змінились офіційні джерела ($(date -u +%F))" --body-file reports/latest.md

      - name: Зібрати сайт
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python build.py --out dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
